services:
  app:
    build:
      context: .
    container_name: murmur-server
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UPLOAD_TOKEN=${UPLOAD_TOKEN}
      - VOICE_DATA_DIR=/data
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    # 如果要放在自己的反向代理（Caddy/nginx/Cloudflare Tunnel）後面，
    # 把上面的 ports 換成加入一個外部 network，讓代理容器用容器名稱連過來即可。
